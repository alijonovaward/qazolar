upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# In production this container sits *behind* the host's own system-level
# Nginx, which terminates TLS and always connects to us over plain HTTP —
# so $scheme here is always "http", even for a request that was genuinely
# HTTPS from the browser's point of view. Blindly setting
# X-Forwarded-Proto to $scheme (as one normally would for the outermost
# proxy) overwrites the correct value the system Nginx already set,
# telling Django every request is insecure — which, combined with
# SECURE_SSL_REDIRECT, is an infinite redirect loop.
# This forwards the incoming header through when present (prod, behind the
# system Nginx) and only falls back to the local scheme when it's the
# outermost proxy itself (local dev, where nothing sets it upstream).
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location /static/ {
        proxy_pass http://backend;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
