services:
  backend:
    build:
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    restart: unless-stopped

  celery-worker:
    build:
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    restart: unless-stopped

  frontend:
    restart: unless-stopped

  nginx:
    restart: unless-stopped
