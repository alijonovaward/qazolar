services:
  backend:
    build:
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    # migrate + collectstatic run on every start, not just the first — both
    # are idempotent, and collectstatic in particular has to: the container
    # is recreated (not just restarted) on every rebuild/redeploy, and
    # /app/staticfiles only ever lived in that old container's throwaway
    # layer, never a volume, so it'd otherwise "forget" it was ever run.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    restart: unless-stopped

  celery-worker:
    build:
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    restart: unless-stopped

  frontend:
    restart: unless-stopped

  nginx:
    restart: unless-stopped
    # This server fronts several other apps behind one system-level Nginx
    # (each on its own 127.0.0.1:<port>, see /etc/nginx/sites-available/) —
    # binding to 0.0.0.0:80 here (the base compose file's dev default) would
    # collide with it. Only listen on localhost; the system Nginx reverse-
    # proxies qazolar.uz to this port.
    ports:
      - "127.0.0.1:8090:80"
